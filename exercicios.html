// ─── STATE ───────────────────────────────────────────────────────────────
let currentCategory='todos', currentSearch='';

// ─── RENDER ──────────────────────────────────────────────────────────────
function renderExercises(){
    const en=isEN();
    const nivelLabel={iniciante:en?'Beginner':'Iniciante',intermediario:en?'Intermediate':'Intermediário',avancado:en?'Advanced':'Avançado'};
    const filtered=exercises.filter(ex=>{
        const catOk=currentCategory==='todos'||ex.category===currentCategory;
        const mTr=en?(TR_EN[ex.muscle]||ex.muscle):ex.muscle;
        const srch=currentSearch;
        const searchOk=ex.name.toLowerCase().includes(srch)||mTr.toLowerCase().includes(srch)||ex.category.includes(srch);
        return catOk&&searchOk;
    });
    document.getElementById('exercisesGrid').innerHTML=filtered.map(ex=>`
        <div class="exercise-card" onclick='openModal(${JSON.stringify(ex).replace(/'/g,"&#39;")})'>
            <div class="card-top">
                <div class="exercise-icon">${ex.icon}</div>
                <div class="card-info">
                    <div class="exercise-name">${ex.name}</div>
                    <div class="exercise-muscle">${en?(TR_EN[ex.muscle]||ex.muscle):ex.muscle}</div>
                </div>
            </div>
            <div class="exercise-tags">
                <span class="tag nivel-${ex.nivel}">${nivelLabel[ex.nivel]}</span>
                <span class="tag">${ex.category}</span>
            </div>
        </div>`).join('');
}

// ─── MODAL ───────────────────────────────────────────────────────────────
function openModal(ex){
    const en=isEN();
    document.getElementById('lbl-pri').textContent=en?'🎯 Primary Muscle':'🎯 Músculo Primário';
    document.getElementById('lbl-sec').textContent=en?'🔗 Secondary Muscles':'🔗 Músculos Secundários';
    document.getElementById('lbl-tec').textContent=en?'⚙️ Execution Technique':'⚙️ Técnica de Execução';
    document.getElementById('lbl-res').textContent=en?'🌬️ Breathing':'🌬️ Respiração';
    document.getElementById('lbl-seg').textContent=en?'⚠️ Safety':'⚠️ Segurança';
    document.getElementById('lbl-pro').textContent=en?'📈 Progression':'📈 Progressão';
    document.getElementById('lbl-var').textContent=en?'🔄 Variations':'🔄 Variações';
    document.getElementById('modalTitle').textContent=ex.name;
    document.getElementById('modalMuscle').textContent=en?(TR_EN[ex.muscle]||ex.muscle):ex.muscle;
    document.getElementById('modalDesc').textContent=en?ex.de:ex.dp;
    document.getElementById('modalPri').textContent=en?ex.pe:ex.pp;
    document.getElementById('modalSec').textContent=en?ex.se:ex.sp;
    document.getElementById('modalTec').textContent=en?ex.te:ex.tp;
    document.getElementById('modalRes').textContent=en?ex.re:ex.rp;
    document.getElementById('modalSeg').textContent=en?ex.sge:ex.sgp;
    document.getElementById('modalVar').textContent=en?ex.ve:ex.vp;
    document.getElementById('modalPro').innerHTML=`
        <div class="prog-item"><div class="prog-level ini">${en?'Beginner':'Iniciante'}</div><div class="prog-desc">${en?ex.ii:ex.ip}</div></div>
        <div class="prog-item"><div class="prog-level int">${en?'Intermediate':'Intermediário'}</div><div class="prog-desc">${en?ex.mi:ex.mp}</div></div>
        <div class="prog-item"><div class="prog-level avd">${en?'Advanced':'Avançado'}</div><div class="prog-desc">${en?ex.ai:ex.ap}</div></div>`;
    document.getElementById('videoPlayer').innerHTML=ex.video
        ?`<iframe width="100%" height="100%" src="${ex.video}" title="${ex.name}" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="border-radius:16px;"></iframe>`
        :`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;"><div style="font-size:4rem;">${ex.icon}</div><div style="color:rgba(255,255,255,0.4);font-size:0.9rem;">${en?'Video coming soon':'Vídeo em breve'}</div></div>`;
    document.getElementById('videoModal').classList.add('show');
    document.body.style.overflow='hidden';
}
window.openModal=openModal;

function closeModal(){
    document.getElementById('videoModal').classList.remove('show');
    document.body.style.overflow='';
    document.getElementById('videoPlayer').innerHTML='';
}
window.closeModal=closeModal;
document.getElementById('videoModal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ─── LANG ────────────────────────────────────────────────────────────────
function setLang(lang){
    localStorage.setItem('language',lang);
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    document.getElementById('subtitleText').textContent=lang==='en'?'Complete library with professional descriptions of each exercise':'Biblioteca completa com descrições profissionais de cada exercício';
    document.getElementById('searchInput').placeholder=lang==='en'?'🔍 Search exercise...':'🔍 Buscar exercício...';
    renderExercises();
}
window.setLang=setLang;

// ─── EVENTS ──────────────────────────────────────────────────────────────
document.querySelectorAll('.category-btn').forEach(btn=>{
    btn.addEventListener('click',function(){
        document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        currentCategory=this.dataset.category;
        renderExercises();
    });
});
document.getElementById('searchInput').addEventListener('input',function(e){
    currentSearch=e.target.value.toLowerCase();
    renderExercises();
});

// ─── INIT ────────────────────────────────────────────────────────────────
(function(){
    const lang=localStorage.getItem('language')||'pt';
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    renderExercises();
})();
</script>
